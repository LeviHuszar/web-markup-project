<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Levi Huszár">
		<meta name="description" content="Contact Bouldertip with a question or a message about bouldering in Haarlem and Amsterdam.">
		<meta name="keywords" content="bouldering, contact, Haarlem, Amsterdam, message">
		<title>Contact</title>
		<link rel="stylesheet" type="text/css" href="css/style.css">
		<link rel="icon" type="image/favicon-icon" href="img/favicon.png">

	</head>
	<body>
		<header>
			<a class="logo-link" href="index.html"><img class="logo" src="img/small-logo-white-transparent.svg" alt="Bouldertip logo" title="Bouldertip logo"></a>
		</header>

		<main class="content contact-layout">
			<aside class="banner">
				<figure>
					<img src="img/banner-long-transparent.svg" alt="Bouldertip banner" title="Bouldertip banner">
					<figcaption>Bouldertip</figcaption>
				</figure>
			</aside>

			<form class="contact-form" action="/" method="post">
				<fieldset>
					<legend><h1>Contact</h1></legend>

					<p class="name-row">
						<label for="name">Name</label>
						<input class="text-field" type="text" id="name" name="name" placeholder="Your name.." required>


						<span class="title-radios">
							<input type="radio" id="mr" name="title-desktop" value="mr">
							<label for="mr">Mr</label>

							<input type="radio" id="ms" name="title-desktop" value="ms">
							<label for="ms">Ms</label>
						</span>

						<select class="title-select" name="title-mobile" aria-label="Title">
							<option value="mr">Mr</option>
							<option value="ms">Ms</option>
						</select>
					</p>

					<p class="field">
						<label for="email">Email</label>
						<input class="text-field" type="email" id="email" name="email" placeholder="Your email.." required>
					</p>

					<p class="field">
						<label for="message">Message</label>
						<textarea class="text-field" id="message" name="message" rows="6" placeholder="Message.."></textarea>
					</p>

					<input class="submit-button" type="submit" value="Submit">
				</fieldset>    
			</form>
		</main>

		<footer class="data-notice">
			<h3>Data Notice:</h3>
		
			<p>Data will only be viewable/storageable by the owner. Stored data is removed after 3 days. Data is not sold to third-party services.</p>
		
			<p>&copy; 2026 Huszár Levi</p>
		</footer>
	</body>
</html>
