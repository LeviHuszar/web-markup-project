<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" type="text/css" href="css/style-contact.css">
    <link rel="icon" type="image/favicon-icon" href="/img/favicon.png"

</head>
<body>
    <header>
        <h1>Contact</h1>
    </header>
    
    <form action="/" method="post">
        
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name.." required>
            

            <label for="identity">Pronouns (Mr/Ms)</label>
            
            <label for="identity">Mr</label>
            <input type="radio" name="identity" value="Mr">

            <label for="identity">Ms</label>
            <input type="radio" name="identity" value="Ms">
            

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email.." required>
            

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" cols="50" placeholder="Your message.." required></textarea>

            <input type="submit" value="Submit">
            
    </form>
</body>

<footer>

</footer>
</html>
