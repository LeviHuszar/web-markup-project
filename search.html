<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouldering Gym Lookup</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="icon" type="image/favicon-icon" href="/img/favicon.png"

</head>
<body>
    <header>
        
        <h1>Bouldering Gym Lookup</h1>

    </header>
    
    <section>
        <form>
            <fieldset>
                <legend>Choose a city</legend>
                <input type="radio" name="city" id="amsterdam" value="amsterdam">
                <label for="amsterdam">Amsterdam</label>
                <input type="radio" name="city" id="haarlem" value="haarlem">
                <label for="haarlem">Haarlem</label>

                <ol id="amsterdam-bouldering">
                    <li>Beest Boulders, Het Lab</li>
                    <li>Beest Boulders</li>
                    <li>Beta Boulders</li>
                    <li>Be Boulder</li>
                    <li>Monk Bouldergym</li>
                </ol>

                <ol id="haarlem-bouldering">
                    <li>Klimmuur Haarlem</li>
                    <li>Boulderhal De Fabriek Haarlem</li>
                </ol>
            </fieldset>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 Huszár Levi</p>
    </footer>
</body>
</html>
